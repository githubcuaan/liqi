[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liqily"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.8,<2",
    "numpy>=2.3",
    "pandas>=2.3",
    "mlxtend>=0.23,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
